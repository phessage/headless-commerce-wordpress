name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  php:
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}'}
      - run: php -l onecomm-headless.php
      - run: php -l src/CatalogClient.php
      - run: php -l src/Plugin.php
      - run: php tests/run.php
  deployed-journey:
    # GitHub withholds secrets from pull requests opened from forks, so the
    # deployed journey cannot allocate a fixture there. It is skipped for forks
    # by design and stays fail-closed for every trusted run, including main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env: {HEADLESS_E2E_ALLOCATOR_TOKEN: '${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Allocate isolated deployed fixture
        run: bash .github/scripts/headless-fixture.sh allocate
      - name: Start a real WordPress runtime
        run: bash tests/docker-smoke.sh
      - name: Run deployed catalog-to-order journey inside WordPress
        run: docker compose run --rm -e HEADLESS_STORE_ID -e HEADLESS_PRODUCT_ID -e HEADLESS_PUBLISHABLE_KEY -e HEADLESS_API_URL cli wp eval-file wp-content/plugins/onecomm-headless/tests/live.php
      - name: Release isolated deployed fixture
        if: always()
        run: bash .github/scripts/headless-fixture.sh release
      - name: Stop WordPress runtime
        if: always()
        run: docker compose down --volumes
