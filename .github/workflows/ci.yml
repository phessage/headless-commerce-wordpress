name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  php:
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}'}
      - run: php -l onecomm-headless.php
      - run: php -l src/CatalogClient.php
      - run: php -l src/Plugin.php
      - run: php tests/run.php
  live-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./tests/docker-smoke.sh
      - name: Configure deployed sandbox storefront page
        run: |
          docker compose run --rm cli wp option update onecomm_store_id 01f5b02f-d7c0-42cd-b880-59f78ea70aa3
          docker compose run --rm cli wp post create --post_type=page --post_status=publish --post_title=Store --post_name=store --post_content='[onecomm_storefront]'
      - name: Deployed sandbox WordPress UI journey
        env:
          WORDPRESS_LIVE_URL: http://localhost:8180/?pagename=store
        run: npm run test:e2e:live
      - if: always()
        run: docker compose down -v
