services:
  db:
    image: mariadb:11
    environment: {MARIADB_DATABASE: wordpress, MARIADB_USER: wordpress, MARIADB_PASSWORD: wordpress, MARIADB_ROOT_PASSWORD: root}
    healthcheck: {test: ['CMD','healthcheck.sh','--connect','--innodb_initialized'], interval: 5s, timeout: 3s, retries: 20}
  wordpress:
    image: wordpress:php8.3-apache
    ports: ['8180:80']
    environment: {WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wordpress, WORDPRESS_DB_PASSWORD: wordpress, WORDPRESS_DB_NAME: wordpress}
    volumes: ['wordpress:/var/www/html', '.:/var/www/html/wp-content/plugins/onecomm-headless:ro']
    depends_on: {db: {condition: service_healthy}}
  cli:
    image: wordpress:cli-php8.3
    user: '33:33'
    environment: {WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wordpress, WORDPRESS_DB_PASSWORD: wordpress, WORDPRESS_DB_NAME: wordpress}
    volumes: ['wordpress:/var/www/html', '.:/var/www/html/wp-content/plugins/onecomm-headless:ro']
    depends_on: {db: {condition: service_healthy}}
volumes: {wordpress: {}}
